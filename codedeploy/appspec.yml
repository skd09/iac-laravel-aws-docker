version: 0.0
os: linux
files:
  - source: /
    destination: /tmp/codedeploy-source
hooks:
  BeforeInstall:
    - location: scripts/codedeploy/wrapper.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/codedeploy/wrapper.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/codedeploy/wrapper.sh
      timeout: 600
      runas: root
  ValidateService:
    - location: scripts/codedeploy/wrapper.sh
      timeout: 300
      runas: root
