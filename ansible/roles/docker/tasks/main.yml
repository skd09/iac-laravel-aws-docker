---
# =============================================================================
# Docker Role - Install Docker & Docker Compose
# =============================================================================

- name: Remove old Docker packages
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  ignore_errors: true

- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Create docker-compose symlink
  file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
  ignore_errors: true

- name: Configure Docker daemon
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }
    mode: "0644"
  notify: Restart Docker

- name: Create Docker build directories
  file:
    path: "{{ docker_dir }}/php{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "8.0"
    - "8.1"
    - "8.2"
    - "8.3"

- name: Copy Dockerfiles
  template:
    src: "Dockerfile.php{{ item }}.j2"
    dest: "{{ docker_dir }}/php{{ item }}/Dockerfile"
    mode: "0644"
  loop:
    - "8.0"
    - "8.1"
    - "8.2"
    - "8.3"

- name: Build base Docker images
  command: "docker build -t myproject-php{{ item }}:latest {{ docker_dir }}/php{{ item }}"
  loop:
    - "8.0"
    - "8.1"
    - "8.2"
    - "8.3"
  register: docker_build
  changed_when: "'Successfully built' in docker_build.stdout or 'writing image' in docker_build.stderr"

- name: Check if Docker network exists
  command: docker network ls --filter name=myproject-network --format "{{ '{{' }}.Name{{ '}}' }}"
  register: docker_network_check
  changed_when: false

- name: Create Docker network
  command: docker network create myproject-network
  when: docker_network_check.stdout == ""